name: Compilar DMG Intel (macOS x64)

# Botón manual en la pestaña Actions: genera NauticMixxx-<versión>-macOS-x64.dmg
# para Mac Intel con macOS 11 Big Sur o posterior (incluido 12 Monterey).
on:
  workflow_dispatch:
    inputs:
      with_s8:
        description: "Incluir soporte Traktor Kontrol S8 (HID, LEDs y pantallas; experimental en macOS)"
        type: boolean
        default: true
      folder_usb:
        description: "Leer USB sin rekordbox (navegación FOLDER, solo lectura)"
        type: boolean
        default: true
      run_tests:
        description: "Ejecutar las pruebas RX3 tras compilar"
        type: boolean
        default: true
      publish_release:
        description: "Adjuntar también el DMG a una release 'intel-<versión>'"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      RX3_ARCH: x64
      RX3_BUILD_ROOT: /Users/runner/rx3-work
      RX3_BUILD_JOBS: 4
      RX3_TESTS_NONFATAL: 1
      RX3_WITH_S8: ${{ inputs.with_s8 && '1' || '0' }}
      RX3_FOLDER_USB: ${{ inputs.folder_usb && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Herramientas
        run: |
          brew install ninja create-dmg
          cmake --version | head -1
          ninja --version

      - name: Caché de dependencias (Mixxx 2.5.6, Sparkle)
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/rx3-work/mixxx-2.5.6.tar.gz
            /Users/runner/rx3-work/dependencies-x64.zip
            /Users/runner/rx3-work/Sparkle-*.tar.xz
          key: rx3-deps-x64-40c29ff-${{ hashFiles('scripts/sparkle-sdk.py') }}

      - name: Compilar NauticMixxx.app (x86_64)
        run: |
          if [ "${{ inputs.run_tests }}" != "true" ]; then export RX3_SKIP_TESTS=1; fi
          ./scripts/build-mixxx-rx3-macos.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Resumen de pruebas y errores
        if: always()
        run: |
          set +e
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          # Pruebas fallidas (por intento) y fallos de aserción, como anotaciones legibles por API
          grep -E '^\[  FAILED  \] [A-Za-z0-9_]+\.[A-Za-z0-9_]+$' "$log" | sort | uniq -c | head -10 | sed 's/^/::warning title=Prueba fallida::/'
          grep -A3 -E 'rx3[a-z_]*test\.cpp:[0-9]+: Failure|_test\.cpp:[0-9]+: Failure' "$log" | tr '\n' ' ' | fold -w 900 | head -6 | sed 's/^/::warning title=Detalle::/'
          grep -E ' error: |^FAILED: |Undefined symbols|SHA-256 incorrecto|Traceback|fatal:' "$log" | grep -v 'ld: warning' | head -8 | cut -c1-900 | sed 's/^/::error title=Compilación::/'
          # CMake Error con 30 líneas de contexto previo y 10 posteriores, en bloques de 900 caracteres
          grep -B30 -A10 'CMake Error' "$log" | tail -60 | tr '\n' '¶' | fold -w 900 | head -8 | sed 's/^/::error title=CMake::/'
          # Últimas 40 líneas del registro
          tail -n 40 "$log" | tr '\n' '¶' | fold -w 900 | head -6 | sed 's/^/::warning title=Final del registro::/'
          if [ -f "$RX3_BUILD_ROOT/build/rx3-tests-failed" ]; then
            echo "::warning title=Pruebas RX3::Algunas pruebas de interfaz fallaron 3 veces en el runner sin pantalla; el DMG se genera igualmente."
          fi
          exit 0

      - name: Comprobar arquitectura y versión mínima
        run: |
          set +e
          app="$RX3_BUILD_ROOT/stage/NauticMixxx.app"
          [ -d "$app" ] || { echo "::error::No existe $app"; exit 1; }
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          archs=$(lipo -archs "$exe" 2>/dev/null); echo "Arquitecturas: $archs"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::El ejecutable no es x86_64 ($archs)"; exit 1;; esac
          minos_of() { vtool -arch x86_64 -show-build "$1" 2>/dev/null | awk '$1=="minos"{v=$2} END{print v}'; }
          minos=$(minos_of "$exe"); echo "macOS mínimo del ejecutable: $minos"
          [ -n "$minos" ] && [ "${minos%%.*}" -le 12 ] || { echo "::error::El ejecutable exige macOS $minos"; exit 1; }
          plist_min=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist" 2>/dev/null)
          echo "LSMinimumSystemVersion: ${plist_min:-(no definido)}"
          if [ -n "$plist_min" ] && [ "${plist_min%%.*}" -gt 12 ]; then echo "::error::Info.plist exige macOS $plist_min"; exit 1; fi
          # Ninguna librería ni ejecutable incluido puede exigir un macOS posterior a Monterey (12).
          bad=0; n=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            n=$((n+1)); m=$(minos_of "$f")
            if [ -n "$m" ] && [ "${m%%.*}" -gt 12 ]; then echo "::error::Requiere macOS $m: ${f#$app/}"; bad=1; fi
          done < <(find "$app" -type f -print0)
          echo "Binarios Mach-O revisados: $n"
          codesign --verify --deep --strict "$app" || { echo "::error::Firma inválida"; exit 1; }
          if [ "$RX3_WITH_S8" = 1 ]; then
            for f in Kontrol-S8-Mixxx-Windows-v1.0.hid.xml Kontrol-S8-Mixxx-Windows-v1.0.js \
                     Kontrol-S8-Mixxx-Windows-v1.0.bulk.xml Kontrol-S8-Mixxx-Windows-v1.0-display.js; do
              [ -f "$app/Contents/Resources/controllers/$f" ] || { echo "::error::Falta el mapping $f"; bad=1; }
            done
            echo "Mappings Kontrol S8 presentes"
          fi
          exit $bad

      - name: Crear DMG
        id: dmg
        run: |
          version=$(cat VERSION)
          app="$RX3_BUILD_ROOT/stage/NauticMixxx.app"
          suffix=; [ "$RX3_WITH_S8" = 1 ] && suffix=-S8
          out="$RUNNER_TEMP/NauticMixxx-$version-macOS-x64$suffix.dmg"
          root="$RUNNER_TEMP/dmg-root"; mkdir -p "$root"
          ditto "$app" "$root/NauticMixxx.app"
          ./scripts/build-app-icon-macos.sh "$RUNNER_TEMP/NauticMixxx.icns"
          # hdiutil a veces falla con "Resource busy" en runners: hasta 3 intentos.
          for try in 1 2 3; do
          rm -f "$out"
          create-dmg \
            --skip-jenkins \
            --add-file ".DS_Store" packaging/macos/dmg-layout.dsstore 0 0 \
            --volname "NauticMixxx $version" \
            --volicon "$RUNNER_TEMP/NauticMixxx.icns" \
            --window-pos 200 120 --window-size 600 360 --icon-size 112 \
            --icon "NauticMixxx.app" 128 180 --hide-extension "NauticMixxx.app" \
            --app-drop-link 472 180 --format UDZO \
            "$out" "$root" && break
          echo "create-dmg falló (intento $try); reintentando..."; sleep 10
          done
          [ -f "$out" ] || { echo "::error::No se pudo crear el DMG"; exit 1; }
          hdiutil verify "$out"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$out")" > "$(basename "$out").sha256")
          cat "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Subir DMG (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NauticMixxx-${{ steps.dmg.outputs.version }}-macOS-x64${{ inputs.with_s8 && '-S8' || '' }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          compression-level: 0
          retention-days: 30

      - name: Publicar release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="intel-${{ steps.dmg.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "NauticMixxx ${{ steps.dmg.outputs.version }} · Mac Intel" \
              --notes "Compilación no oficial para Mac Intel (macOS 11+). Firma ad hoc: la primera vez ábrelo con clic derecho → Abrir." \
              --target "${{ github.sha }}"
          gh release upload "$tag" "${{ steps.dmg.outputs.path }}" "${{ steps.dmg.outputs.path }}.sha256" --clobber
